server:
  port: 8083

spring:
  application:
    name: ms-auth
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/db_auth}
    username: ${SPRING_DATASOURCE_USERNAME:admin}
    password: ${SPRING_DATASOURCE_PASSWORD:admin_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

# ── JWT ──────────────────────────────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET:SmartLogix2026-SuperSecretKey-MustBe256BitsOrMoreForHS256}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}   # 24 horas

logging:
  level:
    com.smartlogix.auth: DEBUG